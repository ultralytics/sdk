name: Publish to PyPI

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      pypi:
        type: boolean
        description: Publish to PyPI

concurrency:
  group: ${{ github.workflow }}
  queue: max

jobs:
  check:
    if: github.repository == 'ultralytics/sdk' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      increment: ${{ steps.check_pypi.outputs.increment }}
      current_tag: ${{ steps.check_pypi.outputs.current_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
      - id: check_pypi
        shell: python
        env:
          PYPI_DISPATCH: ${{ github.event.inputs.pypi }}
        run: |
          import json
          import os
          import re
          import tomllib
          import urllib.error
          import urllib.request

          with open("sdk/python/pyproject.toml", "rb") as file:
              project = tomllib.load(file)["project"]
          local_version = project["version"]
          if not re.fullmatch(r"\d+\.\d+\.\d+", local_version):
              raise ValueError(f"Invalid release version: {local_version}")
          try:
              with urllib.request.urlopen(f"https://pypi.org/pypi/{project['name']}/json", timeout=30) as response:
                  online_version = json.load(response)["info"]["version"]
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise
              online_version = None
          publish = online_version is None or tuple(map(int, local_version.split("."))) > tuple(
              map(int, online_version.split("."))
          )
          publish = publish or os.environ.get("PYPI_DISPATCH") == "true"  # manual recovery re-run
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"increment={str(publish).lower()}\ncurrent_tag=v{local_version}\n")
          print(f"Local: {local_version}, PyPI: {online_version or 'Not Found'}")
          if publish:
              print('Ready to publish new version to PyPI ✅.')
      - name: Tag and Release
        if: steps.check_pypi.outputs.increment == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CURRENT_TAG: ${{ steps.check_pypi.outputs.current_tag }}
        run: |
          if [ -z "$(git ls-remote --tags origin "refs/tags/$CURRENT_TAG")" ]; then
            git config --global user.name "UltralyticsAssistant"
            git config --global user.email "web@ultralytics.com"
            git tag -a "$CURRENT_TAG" -m "$(git log -1 --pretty=%B)"
            git push origin "$CURRENT_TAG"
          fi
          if ! gh release view "$CURRENT_TAG" >/dev/null 2>&1; then
            gh release create "$CURRENT_TAG" --verify-tag --generate-notes --title "$CURRENT_TAG - $(git log -1 --pretty=%s)"
          fi

  build:
    needs: check
    if: needs.check.outputs.increment == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.check.outputs.current_tag }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
      - uses: ultralytics/actions/setup-uv@45a7a2d7c92b0d963c3a5fe7057895ad1e79ebc2
      - run: uv build --project sdk/python
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist
          path: sdk/python/dist/
      - run: uv cache prune --ci

  publish:
    needs: [check, build]
    if: needs.check.outputs.increment == 'true'
    runs-on: ubuntu-latest
    environment:
      name: Release - PyPI
      url: https://pypi.org/p/ultralytics-platform
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1.14
        id: publish
        continue-on-error: true
        with:
          skip-existing: true
      - name: Clean partial attestations
        if: steps.publish.outcome == 'failure'
        run: |
          rm -f dist/*.publish.attestation
          sleep 30
      - name: Retry publish
        if: steps.publish.outcome == 'failure'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1.14
        with:
          skip-existing: true
