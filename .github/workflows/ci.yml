name: CI

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 0 * * *"

jobs:
  Test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/checkout@v7
        with:
          repository: ultralytics/openapi
          # Always consume the generator from main. Never pin this to a commit SHA or tag.
          ref: main
          path: .generator
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - uses: ultralytics/actions/setup-uv@main

      - name: Verify pinned OpenAPI contract
        run: sha256sum --check openapi.sha256

      - name: Regenerate Python SDK
        working-directory: .generator
        env:
          OPENAPI_CONFIG: ${{ github.workspace }}/openapi.config.json
        run: |
          bun install --frozen-lockfile
          bun run generate

      - name: Check generated drift
        run: |
          diff --recursive --unified sdk/python .generator/generated/python

      - name: Validate Python SDK
        run: |
          uvx ruff@0.16.2 format --check --line-length 120 sdk/python tests
          uvx ruff@0.16.2 check sdk/python tests
          python -m compileall -q sdk/python/src
          uv build --project sdk/python
          unzip -l sdk/python/dist/*.whl | grep --quiet '\.dist-info/licenses/LICENSE$'
          uv pip install --system pytest jsonschema referencing "git+file://${GITHUB_WORKSPACE}@$(git rev-parse HEAD)#subdirectory=sdk/python"
          pytest tests -v

  Live:
    name: Full API lifecycle
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: openapi-sync
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/checkout@v7
        with:
          repository: ultralytics/openapi
          # Always consume the generator from main. Never pin this to a commit SHA or tag.
          ref: main
          path: .generator
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - uses: ultralytics/actions/setup-uv@main

      - name: Sync live OpenAPI contract
        run: |
          curl --fail --silent --show-error --location "$(python -c 'import json; print(json.load(open("openapi.config.json"))["upstream"])')" --output openapi.live.json
          if cmp --silent openapi.json openapi.live.json; then
            rm openapi.live.json
          else
            mv openapi.live.json openapi.json
            sha256sum openapi.json > openapi.sha256
          fi

      - name: Regenerate Python SDK
        working-directory: .generator
        env:
          OPENAPI_CONFIG: ${{ github.workspace }}/openapi.config.json
        run: |
          bun install --frozen-lockfile
          bun run generate

      - name: Apply generated changes
        id: sync
        run: |
          sdk_changed=false
          if ! diff --recursive --brief .generator/generated/python sdk/python; then
            sdk_changed=true
            rsync --archive --delete .generator/generated/python/ sdk/python/
          fi
          if [ "$sdk_changed" = false ] && git diff --quiet -- openapi.json openapi.sha256 sdk/python; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "hash=$(printf '%s\n%s\n' "$(sha256sum openapi.json)" "$(git -C .generator rev-parse HEAD)" | sha256sum | cut -c1-12)" >> "$GITHUB_OUTPUT"

      - name: Validate regenerated Python SDK
        if: steps.sync.outputs.changed == 'true'
        run: |
          uvx ruff@0.16.2 format --check --line-length 120 sdk/python tests
          uvx ruff@0.16.2 check sdk/python tests
          python -m compileall -q sdk/python/src
          uv build --project sdk/python
          uv pip install --system pytest jsonschema referencing "./sdk/python"
          pytest tests -v

      - name: Open, validate, and merge contract update
        if: github.ref == 'refs/heads/main' && steps.sync.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets._GITHUB_TOKEN }}
          CONTRACT_HASH: ${{ steps.sync.outputs.hash }}
        run: |
          branch="automation/openapi-${CONTRACT_HASH}"
          pr_url=$(gh pr list --head "$branch" --state open --json url --jq '.[0].url // empty')
          if [ -z "$pr_url" ]; then
            if [ "$(gh pr list --head "$branch" --state all --json number --jq length)" -gt 0 ]; then
              exit 0
            fi
            if ! git ls-remote --exit-code --heads origin "$branch" > /dev/null; then
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              gh auth setup-git
              git switch --create "$branch"
              git add openapi.json openapi.sha256 sdk/python
              git commit -m "Update Platform API contract"
              git push --set-upstream origin "$branch"
            fi
            pr_url=$(gh pr create --base main --head "$branch" --title "Update Platform API contract" --body "Synchronizes the live OpenAPI contract and deterministically regenerates the Python SDK. CI validates the generated package before the workflow merges the exact green head. The package version follows the contract info.version, so merging a bumped version publishes to PyPI.")
          fi
          echo "PR ready: $pr_url"

          head_sha=$(gh pr view "$pr_url" --json headRefOid --jq .headRefOid)
          for _ in {1..60}; do
            checks=$(gh pr checks "$pr_url" --json name,bucket || true)
            if jq --exit-status '
              ([.[].name] | contains(["CLA", "Full API lifecycle", "Test (3.11)", "Test (3.14)", "actions"])) and
              all(.[]; .bucket != "pending")
            ' <<< "$checks" > /dev/null; then
              break
            fi
            sleep 10
          done
          jq --exit-status '
            ([.[].name] | contains(["CLA", "Full API lifecycle", "Test (3.11)", "Test (3.14)", "actions"])) and
            all(.[]; .bucket == "pass" or (.name == "Full API lifecycle" and .bucket == "skipping"))
          ' <<< "$checks" > /dev/null
          gh pr merge "$pr_url" --squash --delete-branch --admin --match-head-commit "$head_sha"

      - name: Create, edit, and delete resources through every SDK operation
        env:
          ULTRALYTICS_API_KEY: ${{ secrets.ULTRALYTICS_API_KEY }}
        run: |
          uv pip install --system ./sdk/python jsonschema referencing
          python tests/live_readonly.py
