name: CI

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 0 * * *"

jobs:
  Test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/checkout@v7
        with:
          repository: ultralytics/openapi
          ref: ee26dcd3c1c60eb06098b5d6851146705dc5b710
          path: .generator

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - uses: ultralytics/actions/setup-uv@main

      - name: Verify pinned OpenAPI contract
        run: |
          curl --fail --silent --show-error --location "$(python -c 'import json; print(json.load(open("openapi.config.json"))["upstream"])')" --output openapi.json
          sha256sum --check openapi.sha256

      - name: Regenerate docs and Python SDK
        working-directory: .generator
        env:
          OPENAPI_CONFIG: ${{ github.workspace }}/openapi.config.json
        run: |
          bun install --frozen-lockfile
          bun run generate
          bun run build

      - name: Check generated drift
        run: |
          diff --recursive --unified sdk/python .generator/generated/python
          find .generator/out -type d -empty -delete
          diff --recursive --unified docs .generator/out

      - name: Validate Python SDK
        run: |
          uvx ruff@0.16.2 format --check --line-length 120 sdk/python tests
          uvx ruff@0.16.2 check sdk/python tests
          python -m compileall -q sdk/python/src
          uv build --project sdk/python
          unzip -l sdk/python/dist/*.whl | grep --quiet '\.dist-info/licenses/LICENSE$'
          uv pip install --system pytest "git+file://${GITHUB_WORKSPACE}@$(git rev-parse HEAD)#subdirectory=sdk/python"
          pytest tests -v

  Live:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: ultralytics/actions/setup-uv@main
      - name: Validate every read-only production endpoint
        env:
          ULTRALYTICS_API_KEY: ${{ secrets.ULTRALYTICS_API_KEY }}
        run: |
          uv pip install --system jsonschema "./sdk/python"
          python tests/live_readonly.py
