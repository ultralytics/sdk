# Ultralytics 🚀 AGPL-3.0 License - https://ultralytics.com/license

[build-system]
requires = ["uv_build>=0.12.3,<0.13"]
build-backend = "uv_build"

[project]
name = "ultralytics-platform"
version = "0.1.0"
description = "Python client for Ultralytics Platform API"
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["httpx>=0.28,<1"]

[project.urls]
Repository = "https://github.com/ultralytics/sdk"
Issues = "https://github.com/ultralytics/sdk/issues"

[tool.ruff]
line-length = 120

[tool.uv.build-backend]
module-name = "ultralytics_platform"
